<!DOCTYPE html><html lang='fr'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1.0'><title>Carte du jour - Ravito</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#fff;font-family:Arial,sans-serif;text-align:center;padding:30px 15px}.logo{max-width:400px;width:90%;margin:0 auto 30px;display:block}.intro{max-width:700px;margin:0 auto 40px;font-size:1.3rem;line-height:1.5;color:#222}.scratch-container{position:relative;width:350px;height:220px;margin:auto}.prize{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;border:4px solid #1F4D3A;border-radius:15px;background:#f8fff8;padding:20px;color:#1F4D3A;font-size:1.8rem;font-weight:bold}.prize small{margin-top:10px;font-size:1.2rem}#scratch{position:absolute;top:0;left:0;border-radius:15px;touch-action:none}.footer{margin-top:25px;color:#666;font-size:.9rem}</style></head><body><img src='ravito.png' alt='Logo Ravito' class='logo'><div class='intro'>Grattez vite pour accéder à notre carte du jour et découvrir votre réduction appliquée. Bonne chance🍀!</div><div class='scratch-container'><div class='prize'>👶 Bébé prévu en avril 2027<small>Séréna & Christophe ❤️</small></div><canvas id='scratch'></canvas></div><div class='footer'>Grattez avec votre doigt ou votre souris.</div><script>const canvas=document.getElementById('scratch');const ctx=canvas.getContext('2d');const container=document.querySelector('.scratch-container');canvas.width=container.offsetWidth;canvas.height=container.offsetHeight;ctx.fillStyle='#9a9a9a';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.font='bold 26px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('🎁 GRATTEZ ICI 🎁',canvas.width/2,120);ctx.globalCompositeOperation='destination-out';let s=false;function scratch(x,y){ctx.beginPath();ctx.arc(x,y,22,0,Math.PI*2);ctx.fill()}canvas.addEventListener('mousedown',()=>s=true);canvas.addEventListener('mouseup',()=>s=false);canvas.addEventListener('mouseleave',()=>s=false);canvas.addEventListener('mousemove',e=>{if(!s)return;const r=canvas.getBoundingClientRect();scratch(e.clientX-r.left,e.clientY-r.top)});canvas.addEventListener('touchstart',()=>s=true);canvas.addEventListener('touchend',()=>s=false);canvas.addEventListener('touchmove',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();const t=e.touches[0];scratch(t.clientX-r.left,t.clientY-r.top)});</script></body></html>
